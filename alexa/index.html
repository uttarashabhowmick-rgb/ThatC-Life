<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexa+ · ThatC Life simulator</title>
<style>
:root{--bg:#05070d;--panel:#0d1220;--line:#1c2540;--text:#eaf0ff;--dim:#8d9bbf;--blue:#2aa8ff;--glow:#2aa8ff}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#0d2a52 0,transparent 60%),var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0}
main{display:flex;flex-direction:column;min-height:100vh;padding:28px 32px;gap:18px}
header{display:flex;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
header .pill{margin-left:auto;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:#4ade80;border-color:#1f5a38}
.orbwrap{display:grid;place-items:center;padding:10px 0 4px}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6f1ff,#2aa8ff 45%,#0b3fb8 80%);box-shadow:0 0 70px -6px var(--glow),inset 0 0 40px rgba(255,255,255,.25);transition:transform .3s}
.orb.listening{animation:breathe 1.1s infinite}.orb.speaking{animation:talk .5s infinite alternate}
@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 110px 0 var(--glow)}}@keyframes talk{to{transform:scale(1.06)}}
.status{text-align:center;color:var(--dim);font-size:14px;height:20px}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.b{max-width:85%;padding:12px 16px;border-radius:18px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.u{align-self:flex-end;background:#16335f;border-bottom-right-radius:6px}
.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.a small{display:block;color:var(--blue);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:99px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--blue)}
form{display:flex;gap:10px}
input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:14px 18px;border-radius:99px;font-size:16px;outline:none}
input:focus{border-color:var(--blue)}
button.mic{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,#2aa8ff,#0b5fe0);color:#fff;font-size:22px;cursor:pointer}
button.mic.on{background:#ff3d5a}
aside{border-left:1px solid var(--line);background:#070a13;display:flex;flex-direction:column;min-height:0}
aside h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:20px 20px 8px;font-weight:600}
aside p.sub{padding:0 20px 12px;color:var(--dim);font-size:12px}
#trace{flex:1;overflow:auto;padding:0 14px 20px;font:12px/1.5 ui-monospace,Menlo,monospace}
.t{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.t div{padding:4px 10px;white-space:pre-wrap;word-break:break-word}
.t .h{background:#0e1730;color:var(--blue)}.t .rq{color:#c5d2f5}.t .rs{color:#7be3a6;border-top:1px solid var(--line)}
.demo{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.demo button{font-size:12px;padding:7px 12px;border-radius:8px;border:1px dashed #3a4a78;background:none;color:var(--dim);cursor:pointer}
</style><style>@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:60vh 40vh;height:100vh;overflow:hidden}main{min-height:0;height:60vh;padding:16px 18px;gap:10px}aside{border-left:0;border-top:1px solid var(--line)}.orb{width:84px;height:84px}.orbwrap{padding:0}.chips{display:none}aside h2{padding:12px 16px 4px}aside p.sub{display:none}}</style></head><body>
<main>
  <header><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#2aa8ff" stroke-width="3"/></svg><h1>Alexa+ · simulated</h1><span class="pill" id="conn">connecting…</span></header>
  <div class="orbwrap"><div class="orb" id="orb"></div></div>
  <div class="status" id="status">Tap the mic or type. Everything you say is routed to the MCP server.</div>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" placeholder='Try: "I need to finish an investor presentation in two hours"' autocomplete="off"><button type="button" class="mic" id="mic" title="Speak">🎙</button></form>
</main>
<aside>
  <h2>MCP trace · Streamable HTTP · 2025-11-25</h2><p class="sub">Live JSON-RPC between this simulated Alexa+ and the self-hosted ThatC Life MCP server at <b>/mcp</b>.</p>
  <div id="trace"></div>
  <div class="demo"><button data-adv="15">⏩ +15 min</button><button data-adv="30">⏩ +30 min</button><button id="reset">↺ Reset</button><span style="font-size:11px;color:#59648a;align-self:center">demo clock controls</span></div>
</aside>
<script src="sim.js"></script></body></html>
